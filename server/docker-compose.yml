# DevC.KPI — full server stack (PostgreSQL + API + client + a TLS reverse proxy), Docker Compose.
#
# The engine images are licence-gated: DevCircle provides the registry host, a pull credential, and the
# image tag. See docs/08-run-the-server.md. Containers run as KPI_UID:KPI_GID (non-root); provide a TLS
# certificate for your host in ./certs (referenced by nginx.conf).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kpi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${KPI_IMAGE}/api:${KPI_IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${KPI_UID}:${KPI_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080          # http inside the container; nginx terminates TLS
      HOME: /srv/kpi/api/home                 # OpenIddict signing keys + DataProtection persist here — back it up
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false;"
      Reporting__ConfigPath: /srv/kpi/config
      SECRETS__PATH: /srv/kpi/secrets
    volumes:
      - ./api/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./config:/srv/kpi/config:ro     # your tenant config (empty is fine — the demo is baked into the image)
      - ./plugins:/srv/kpi/plugins:ro   # drop your plugin bundle here, then `docker compose restart api`
      - ./secrets:/srv/kpi/secrets:ro   # connection strings etc. (empty is fine for the demo)
      - ./api/home:/srv/kpi/api/home
      # Your licence. WRITABLE and persistent on purpose: activating with an activation key makes the engine
      # fetch and write the licence itself, and it renews in place from then on. Without this mount the engine
      # cannot activate (the rest of /srv/kpi is read-only) and anything it did write would be lost the next
      # time the container is recreated. Start empty — a fresh install serves for a grace period so you can
      # activate it. Back this directory up with ./api/home.
      - ./licence:/srv/kpi/licence

  client:
    image: ${KPI_IMAGE}/client:${KPI_IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${KPI_UID}:${KPI_GID}"
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HOME: /srv/kpi/client/home
    volumes:
      - ./client/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./client/home:/srv/kpi/client/home

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - client
    ports:
      - "8443:8443"                       # browse https://localhost:8443 (map to 443 if you like)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro       # localhost.crt + localhost.key (you provide these — see docs)

volumes:
  kpi-pgdata:
