# Minimal TLS reverse proxy for the one-box stack. It terminates HTTPS and routes:
#   /api  -> the API container   (the engine runs under PathBase=/api)
#   /     -> the client (Blazor WASM host)
# X-Forwarded-Proto=https is REQUIRED: OpenIddict rejects non-HTTPS auth requests, and behind a
# proxy it trusts the forwarded scheme — this is why plain http does not work.
events {}
http {
  server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    client_max_body_size 50m;

    location /api {
      proxy_pass http://api:8080;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://client:8080;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
